<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Present Perfect Continuous Test</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#eaf4ff,#fdfcff);color:#1f2937;min-height:100vh}
    .container{max-width:860px;margin:30px auto;padding:16px}
    .card{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,0.10);overflow:hidden;border:1px solid #e5e7eb}
    .header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:28px 24px;text-align:center}
    .header h1{font-size:30px;margin-bottom:8px}
    .header p{opacity:.92;font-size:15px}
    #nameSection{padding:32px 24px;text-align:center}
    #nameSection h2{font-size:22px;color:#4f46e5;margin-bottom:18px}
    #nameInput{width:100%;max-width:380px;padding:14px 18px;font-size:17px;border:2px solid #c7d2fe;border-radius:12px;outline:none;transition:.2s}
    #nameInput:focus{border-color:#4f46e5}
    #startBtn{margin-top:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;padding:14px 36px;font-size:17px;font-weight:700;border-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.25);transition:.2s}
    #startBtn:hover{opacity:.92;transform:translateY(-1px)}
    #leaderboard{padding:0 24px 28px}
    #leaderboard h3{font-size:18px;color:#4f46e5;margin-bottom:12px;text-align:center}
    .lb-table{width:100%;border-collapse:collapse;font-size:15px}
    .lb-table th{background:#eef2ff;color:#3730a3;padding:10px 12px;text-align:left}
    .lb-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0}
    .lb-table tr:nth-child(even) td{background:#fafafa}
    .lb-empty{text-align:center;color:#9ca3af;font-style:italic;padding:12px}
    .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
    .timer{font-size:22px;font-weight:700;color:#dc2626;background:#fff1f2;padding:9px 18px;border-radius:12px;border:1px solid #fecdd3}
    .info{font-size:14px;color:#374151;font-weight:600}
    form{padding:20px 24px}
    .question{background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;transition:.2s}
    .question:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.05)}
    .question h3{font-size:17px;color:#111827;margin-bottom:12px}
    .options label{display:block;background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:.2s}
    .options label:hover{background:#eef2ff;border-color:#818cf8}
    .options input[type=radio]{margin-right:10px;transform:scale(1.1)}
    .submit-box{text-align:center;padding:6px 0 24px}
    #submitBtn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:15px 34px;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;box-shadow:0 8px 18px rgba(16,185,129,.25);transition:.2s}
    #submitBtn:hover{transform:translateY(-2px);opacity:.95}
    #result{margin:0 24px 24px;padding:18px;border-radius:14px;font-size:18px;font-weight:700;text-align:center;display:none}
    .good{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
    .warning{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}
    .correct{border:2px solid #22c55e!important;background:#ecfdf5!important}
    .wrong{border:2px solid #ef4444!important;background:#fef2f2!important}
    .footer-note{text-align:center;font-size:13px;color:#9ca3af;padding:0 20px 20px}
    #quizSection{display:none}
  </style>
</head>
<body>
<div class="container">
 <div class="card">
  <div class="header">
    <h1>📝 Present Perfect Continuous Test</h1>
    <p>Elementary Level &bull; 20 Questions &bull; 20-minute timer</p>
  </div>
  <div id="nameSection">
    <h2>Enter your name to begin</h2>
    <input id="nameInput" type="text" placeholder="Your full name..." maxlength="60" autocomplete="off"/>
    <br/>
    <button id="startBtn" onclick="startQuiz()">Start Test ▶</button>
    <p id="nameError" style="color:#dc2626;font-size:14px;margin-top:8px"></p>
  </div>
  <div id="leaderboard">
    <h3>🏆 Global Leaderboard</h3>
    <div id="lbContent"><p class="lb-empty">Loading…</p></div>
  </div>
  <div id="quizSection">
    <div class="top-bar">
      <div class="timer" id="timer">20:00</div>
      <div class="info" id="studentLabel"></div>
    </div>
    <form id="quizForm"></form>
    <div class="submit-box">
      <button id="submitBtn" type="button" onclick="submitQuiz()">Submit Answers ✔</button>
    </div>
    <div id="result"></div>
    <div class="footer-note">Good luck! 🍀 This test was made with ❤️ for elementary learners.</div>
  </div>
 </div>
</div>
<script>
const QUESTIONS=[
  {q:"1. I ____ English for two years.",options:["have been studying","has been studying","am studying"],ans:0},
  {q:"2. She ____ in the garden since morning.",options:["have been working","has been working","is work"],ans:1},
  {q:"3. They ____ football for an hour.",options:["have been playing","has been playing","have playing"],ans:0},
  {q:"4. He ____ TV since 6 o'clock.",options:["have been watching","has been watching","has watching"],ans:1},
  {q:"5. We ____ for the bus for 20 minutes.",options:["have been waiting","has been waiting","are waiting since"],ans:0},
  {q:"6. My mother ____ dinner all afternoon.",options:["have been cooking","has been cooking","cooking"],ans:1},
  {q:"7. You ____ too much noise.",options:["has been making","have been making","have making"],ans:1},
  {q:"8. The baby ____ for half an hour.",options:["has been crying","have been crying","crying"],ans:0},
  {q:"9. It ____ all day.",options:["have been raining","has been raining","is raining since"],ans:1},
  {q:"10. I ____ my homework since 4 p.m.",options:["have been doing","has been doing","have doing"],ans:0},
  {q:"11. ____ she been reading this book for a week?",options:["Have","Has","Is"],ans:1},
  {q:"12. ____ they been sleeping since noon?",options:["Has","Have","Are"],ans:1},
  {q:"13. He ____ not been feeling well lately.",options:["have","has","is"],ans:1},
  {q:"14. We ____ not been using the computer.",options:["has","have","are"],ans:1},
  {q:"15. My friends ____ for the test since lunch time.",options:["has been studying","have been studying","have studying"],ans:1},
  {q:"16. The dog ____ at the cat for ten minutes.",options:["has been barking","have been barking","barks"],ans:0},
  {q:"17. We use present perfect continuous with ____.",options:["for / since","yesterday only","last year only"],ans:0},
  {q:"18. Choose the correct structure.",options:["subject + has/have + been + verb-ing","subject + is + verb 2","subject + did + verb-ing"],ans:0},
  {q:"19. \"They have been running\" means the action started in the past and ____.",options:["continues to now","finished last year only","happens tomorrow"],ans:0},
  {q:"20. Which sentence is correct?",options:["She has been learning English for six months.","She have been learning English for six months.","She has learning English for six months."],ans:0},
];
let studentName="",totalTime=20*60,timerInterval=null,submitted=false;
async function loadLeaderboard(){
  try{
    const r=await fetch('/api/leaderboard');
    const data=await r.json();
    renderLB(data.scores||[]);
  }catch(e){renderLB([]);}
}
function renderLB(scores){
  const el=document.getElementById('lbContent');
  if(!scores.length){el.innerHTML='<p class="lb-empty">No scores yet. Be the first! 🎉</p>';return;}
  const medals=['🥇','🥈','🥉'];
  let html='<table class="lb-table"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>Time</th></tr></thead><tbody>';
  scores.forEach((s,i)=>{
    const m=medals[i]||`${i+1}.`;
    html+=`<tr><td>${m}</td><td>${esc(s.name)}</td><td>${s.score}/20</td><td>${s.date}</td></tr>`;
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function buildQuestions(){
  const form=document.getElementById('quizForm');
  form.innerHTML=QUESTIONS.map((q,i)=>`
    <div class="question" id="qq${i}">
      <h3>${q.q}</h3>
      <div class="options">
        ${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}
      </div>
    </div>`).join('');
}
function startQuiz(){
  const val=document.getElementById('nameInput').value.trim();
  if(!val){document.getElementById('nameError').textContent='Please enter your name!';return;}
  studentName=val;
  document.getElementById('nameSection').style.display='none';
  document.getElementById('leaderboard').style.display='none';
  document.getElementById('quizSection').style.display='block';
  document.getElementById('studentLabel').textContent='👤 '+studentName;
  buildQuestions();
  startTimer();
}
function startTimer(){
  const el=document.getElementById('timer');
  timerInterval=setInterval(()=>{
    if(submitted){clearInterval(timerInterval);return;}
    const m=Math.floor(totalTime/60),s=totalTime%60;
    el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(totalTime<=0){clearInterval(timerInterval);submitQuiz(true);}
    totalTime--;
  },1000);
}
async function submitQuiz(auto=false){
  if(submitted)return;
  submitted=true;
  clearInterval(timerInterval);
  let score=0;
  QUESTIONS.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    const qEl=document.getElementById('qq'+i);
    qEl.querySelectorAll('label').forEach(l=>{
      if(parseInt(l.querySelector('input').value)===q.ans)l.classList.add('correct');
    });
    if(sel){
      if(parseInt(sel.value)===q.ans)score++;
      else sel.parentElement.classList.add('wrong');
    }
  });
  const res=document.getElementById('result');
  res.style.display='block';
  res.className=score>=14?'good':'warning';
  res.innerHTML=(auto?'⏰ Time is up! ':'')+`Your score: <strong>${score}/20</strong>`;
  document.getElementById('submitBtn').disabled=true;
  try{
    await fetch('/api/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:studentName,score,total:20})
    });
  }catch(e){}
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
loadLeaderboard();
</script>
</body>
</html>
